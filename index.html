<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="description" content="Topic Pulse: only the news that moves your topics.">
  <title>Topic Pulse</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Show start-up failures instead of an endless "Loading…".
    (function () {
      function report(msg) {
        var m = document.getElementById("main");
        if (m && m.getAttribute("data-started") !== "1") {
          m.textContent = "Topic Pulse could not start: " + msg + ". Reload the page; if it keeps happening, try another browser.";
        }
      }
      window.addEventListener("error", function (e) {
        var src = e.target && (e.target.src || e.target.href);
        report(src ? "could not load " + src : (e.message || "script error"));
      }, true);
      window.addEventListener("unhandledrejection", function (e) {
        report(String((e.reason && (e.reason.message || e.reason.code)) || e.reason));
      });
      setTimeout(function () { report("timed out while loading"); }, 20000);
    })();
  </script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="top">
    <a class="brand" href="#/">
      <svg viewBox="0 0 108 108" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" d="M22 58h11l7-18 11 34 9-24 6 8h20"/></svg>
      <span>Topic Pulse</span>
    </a>
    <nav id="nav"></nav>
  </header>
  <div id="banner" class="banner" role="status" hidden></div>
  <main id="main">
    <p class="muted center">Loading…</p>
  </main>
  <dialog id="dialog"></dialog>
  <!-- Prompt button: visible once the prompt holds at least one article. -->
  <div id="prompt-fab" class="prompt-fab" hidden>
    <button id="prompt-edit" class="fab-mini" type="button" title="Review prompt" aria-label="Review prompt">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17.3V21h3.7L17.8 9.9l-3.7-3.7L3 17.3zM20.7 7a1 1 0 0 0 0-1.4l-2.3-2.3a1 1 0 0 0-1.4 0l-1.8 1.8 3.7 3.7L20.7 7z"/></svg>
    </button>
    <button id="prompt-copy" class="fab" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 1H4a2 2 0 0 0-2 2v14h2V3h12V1zm3 4H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm0 16H8V7h11v14z"/></svg>
      <span id="prompt-label">Copy prompt</span>
      <span id="prompt-count" class="fab-count">0</span>
    </button>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript><p class="center">Topic Pulse needs JavaScript.</p></noscript>
</body>
</html>
